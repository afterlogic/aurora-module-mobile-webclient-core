name: Unit Tests

on:
  push:
    paths:
      - 'vue-mobile/**'
      - '.github/workflows/unit.yml'
  pull_request:
    paths:
      - 'vue-mobile/**'
      - '.github/workflows/unit.yml'

defaults:
  run:
    working-directory: vue-mobile

jobs:
  unit:
    name: Vitest (unit / component)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vue-mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit
