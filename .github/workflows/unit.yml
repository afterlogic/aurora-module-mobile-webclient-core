name: Unit Tests

on:
  push:
    paths:
      - 'vue-mobile/**'
      - '.github/workflows/unit.yml'
  pull_request:
    paths:
      - 'vue-mobile/**'
      - '.github/workflows/unit.yml'

defaults:
  run:
    working-directory: vue-mobile

jobs:
  unit:
    name: Vitest (unit / component)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: vue-mobile/yarn.lock

      - name: Enable Yarn classic
        run: corepack enable && corepack prepare yarn@1.22.22 --activate

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run unit tests
        run: yarn test:unit
